# Worker name must be unique in your CF account. Change if you hit name conflict.
name = "trexapi-investor-demo"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Required: create DB first with: npx wrangler d1 create trexapi
# Then paste the database_id below (UUID format).
[[d1_databases]]
binding = "DB"
database_name = "trexapi"
database_id = "c62916d3-49cd-4952-b27c-115727bf964c"

[vars]
TZP_REGION = "us-west-1"
DEV_API_KEY = "demo-investor-key"
